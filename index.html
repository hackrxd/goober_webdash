<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini RLHF Roleplay Chat</title>
<style>
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background-color: #121212;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #chat {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .message {
    padding: 10px 15px;
    border-radius: 10px;
    max-width: 75%;
    word-wrap: break-word;
  }
  .user {
    background-color: #1f1f1f;
    align-self: flex-end;
  }
  .bot {
    background-color: #2b2b2b;
    align-self: flex-start;
  }
  .selected {
    border: 2px solid #00ff99;
  }
  #inputForm {
    display: flex;
    padding: 10px;
    background-color: #1a1a1a;
    gap: 10px;
  }
  #prompt {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background-color: #2a2a2a;
    color: #e0e0e0;
  }
  #send {
    padding: 0 20px;
    border: none;
    border-radius: 8px;
    background-color: #00ff99;
    color: #121212;
    font-weight: bold;
    cursor: pointer;
  }
  #send:hover {
    background-color: #00cc77;
  }
  .response-option {
    background-color: #333333;
    padding: 8px 12px;
    margin-top: 5px;
    border-radius: 8px;
    cursor: pointer;
  }
  .response-option:hover {
    background-color: #444444;
  }
  .markdown {
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="chat"></div>
<form id="inputForm">
  <input type="text" id="prompt" placeholder="Enter your message..." autocomplete="off"/>
  <button type="submit" id="send">Send</button>
</form>

<script>
const chat = document.getElementById('chat');
const inputForm = document.getElementById('inputForm');
const promptInput = document.getElementById('prompt');

const ws = new WebSocket(`ws://${location.host}/ws`);
const responsesBuffer = {};

function addMessage(text, sender="bot", selected=false) {
  const div = document.createElement('div');
  div.className = `message ${sender} ${selected ? "selected" : ""}`;
  div.innerHTML = `<span class="markdown">${text}</span>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function streamResponse(index, chunk, done=false) {
  if (!responsesBuffer[index]) {
    responsesBuffer[index] = "";
  }
  responsesBuffer[index] += chunk;

  const elemId = `response-${index}`;
  let elem = document.getElementById(elemId);
  if (!elem) {
    elem = document.createElement('div');
    elem.id = elemId;
    elem.className = 'bot message';
    chat.appendChild(elem);
  }
  elem.innerHTML = `<span class="markdown">${responsesBuffer[index]}</span>`;

  if (done) {
    elem.classList.add('response-option');
    elem.onclick = () => {
      document.querySelectorAll('.response-option').forEach(el => el.classList.remove('selected'));
      elem.classList.add('selected');
    };
    chat.scrollTop = chat.scrollHeight;
  }
  chat.scrollTop = chat.scrollHeight;
}

ws.onmessage = (event) => {
  const data = JSON.parse(event.data);

  if (data.selected) {
    addMessage(data.selected, "bot", true);
    Object.keys(responsesBuffer).forEach(key => {
      const elem = document.getElementById(`response-${key}`);
      if (elem) elem.remove();
    });
    for (const key in responsesBuffer) delete responsesBuffer[key];
    return;
  }

  if ("index" in data && "text" in data) {
    streamResponse(data.index, data.text, data.done);
  }
};

inputForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const message = promptInput.value.trim();
  if (!message) return;

  addMessage(message, "user");
  ws.send(JSON.stringify({prompt: message}));
  promptInput.value = "";
});
</script>
</body>
</html>
